{% extends 'ubs/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 mt-5">
        <div class="card shadow-sm">
            <div class="card-body p-5">
                <h3 class="mb-4 text-center">Login do Paciente</h3>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}

                <form method="POST" action="{% url 'login_paciente' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">CPF (Apenas números)</label>
                        <input type="text" class="form-control" name="cpf" placeholder="Ex: 12345678900" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mt-3 px-4">Entrar</button>
                    
                    <div class="text-center mt-3">
                        <a href="{% url 'cadastro_paciente' %}" class="text-decoration-none">Ainda não tem conta? Cadastre-se</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
