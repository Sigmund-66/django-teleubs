{% extends 'ubs/base.html' %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body p-4">
        <h3 class="mb-4">Cadastro de Paciente</h3>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'cadastro_paciente' %}">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Nome completo</label>
                        <input type="text" class="form-control" name="nome_completo" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Telefone</label>
                            <input type="text" class="form-control" name="telefone">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Celular</label>
                            <input type="text" class="form-control" name="celular" placeholder="(84) 9****-****"
                                required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">CPF</label>
                        <input placeholder="Somente números" type="text" class="form-control" name="cpf"
                            placeholder="000.000.000-00" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">RG (Apenas números)</label>
                        <input type="number" class="form-control" name="rg" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Número cartão do SUS</label>
                        <input type="text" class="form-control" name="cartao_sus" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Senha</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Confirmar Senha</label>
                            <input type="password" class="form-control" name="confirm_password" required>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Logradouro / Endereço</label>
                        <input type="text" class="form-control" name="logradouro" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Data de Nascimento</label>
                        <input type="date" class="form-control" name="data_nascimento" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Sexo</label>
                        <select class="form-select" name="sexo" required>
                            <option value="" disabled selected>Selecione</option>
                            <option value="M">Masculino</option>
                            <option value="F">Feminino</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nome da Mãe</label>
                        <input type="text" class="form-control" name="nome_mae" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nome do Pai</label>
                        <input type="text" class="form-control" name="nome_pai">
                    </div>
                </div>
            </div>
            <div class="d-flex gap-3 mt-3">
                <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold">Cadastrar-se</button>
                <a href="{% url 'login_paciente' %}" class="btn btn-outline-secondary px-4 py-2">
                    <i class="bi bi-arrow-left me-1"></i>Voltar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
